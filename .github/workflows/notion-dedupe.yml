name: Notion - Dedupe Espelho (manual)

on:
  workflow_dispatch:
    inputs:
      mirror:
        description: "Qual espelho limpar"
        required: true
        default: "CalendarioEditorial"
        type: choice
        options:
          - CalendarioEditorial
          - YouTube
          - Reuniões
          - Tarefas_GCMD
          - Controle_Demandas
      dry_run:
        description: "Só simular (não arquivar nada de verdade)?"
        required: true
        default: "true"
        type: boolean

concurrency:
  # mesmo grupo do workflow de sync diário: garante que os dois nunca
  # rodem ao mesmo tempo e disputem o cache do .state
  group: notion-automations-mirrors
  cancel-in-progress: false   # aqui NÃO queremos cancelar um pelo outro, só serializar

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Restaurar estado do espelho (.state)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: gcmd-mirror-state-${{ github.run_number }}
          restore-keys: |
            gcmd-mirror-state-

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar dedupe
        run: |
          echo "🧹 Rodando dedupe_mirror.py (mirror=${{ inputs.mirror }}, dry_run=${{ inputs.dry_run }})"
          python dedupe_mirror.py
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # ==================================================
          # 🔗 Mapeia o nome de secret certo pro espelho escolhido.
          # Reaproveita EXATAMENTE os secrets que o workflow de sync já usa —
          # nenhum secret novo precisa ser criado.
          # ==================================================
          DEDUPE_MIRROR_DB_ID: >-
            ${{
              inputs.mirror == 'CalendarioEditorial' && secrets.DATABASE_ID_CALENDARIOEDITORIAL_ESPELHO ||
              inputs.mirror == 'YouTube' && secrets.DATABASE_ID_YOUTUBE_ESPELHO ||
              inputs.mirror == 'Reuniões' && secrets.DATABASE_ID_REUNIOES_ESPELHO ||
              inputs.mirror == 'Tarefas_GCMD' && secrets.DATABASE_ID_TAREFAS_GCMD_ESPELHO ||
              secrets.DATABASE_ID_CONTROLE_DEMANDAS_ESPELHO
            }}
          # precisa bater com o "name" usado em mirror_database() no script principal,
          # pra atualizar o MESMO arquivo .state/mirror_<nome>.json
          DEDUPE_STATE_NAME: ${{ inputs.mirror }}
          DEDUPE_ORIGEM_PROP: "Origem"
          DEDUPE_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}

      - name: Salvar estado do espelho (.state)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: gcmd-mirror-state-${{ github.run_number }}
